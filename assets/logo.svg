<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Document outline -->
  <path d="M19 14 H37 L45 22 V48 C45 49.1 44.1 50 43 50 H19 C17.9 50 17 49.1 17 48 V16 C17 14.9 17.9 14 19 14 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  
  <!-- Corner fold -->
  <path d="M37 14 V20 C37 21.1 37.9 22 39 22 H45 Z" fill="url(#fold)"/>

  <!-- Document content lines -->
  <rect x="22" y="26" width="14" height="2.5" rx="1.25" fill="#2563EB" />
  <rect x="22" y="32" width="20" height="2" rx="1" fill="#94A3B8" />
  <rect x="22" y="37" width="17" height="2" rx="1" fill="#94A3B8" />

  <!-- Preview badge (Eye badge bottom right) -->
  <circle cx="43" cy="43" r="11" fill="#10B981" filter="url(#shadow)"/>
  <!-- Eye icon in badge -->
  <ellipse cx="43" cy="43" rx="6" ry="3.8" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="43" cy="43" r="1.8" fill="#FFFFFF"/>
</svg>
