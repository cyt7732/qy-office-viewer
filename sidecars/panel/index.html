<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office 预览</title>
  <link rel="stylesheet" href="/styles.css?v=1.2.0">
  <!-- Antigravity Host Bridge -->
  <script src="/preload.js"></script>
</head>
<body>
  <!-- Consolidated Compact Header Bar (~34px) -->
  <header class="header-bar">
    <div class="header-left">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="14" fill="#2563EB"/>
          <path d="M19 14 H37 L45 22 V48 C45 49.1 44.1 50 43 50 H19 C17.9 50 17 49.1 17 48 V16 C17 14.9 17.9 14 19 14 Z" fill="#FFFFFF"/>
          <path d="M37 14 V20 C37 21.1 37.9 22 39 22 H45 Z" fill="#93C5FD"/>
          <circle cx="43" cy="43" r="10" fill="#10B981"/>
          <ellipse cx="43" cy="43" rx="5.5" ry="3.5" stroke="#FFFFFF" stroke-width="1.8"/>
          <circle cx="43" cy="43" r="1.6" fill="#FFFFFF"/>
        </svg>
        <span class="brand-name">Office 预览</span>
      </div>
      <div class="header-status" id="header-status">就绪</div>
    </div>

    <div class="header-right">
      <!-- 紧凑高亮主操作按钮 -->
      <button id="btn-open-default" class="primary-btn-compact" title="在系统默认程序中打开" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span id="btn-open-label">打开</span>
      </button>

      <!-- 次要操作工具群 -->
      <button id="btn-reveal" class="icon-tool-btn" title="在 Windows 资源管理器中定位文件" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="tool-btn-text">定位</span>
      </button>

      <button id="btn-copy-path" class="icon-tool-btn" title="复制绝对文件路径到剪贴板" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span class="tool-btn-text">路径</span>
      </button>

      <!-- 刷新按钮 -->
      <button id="btn-reload-ui" class="icon-btn" style="width: 22px; height: 22px; padding: 0; background: transparent; border: none;" title="重新载入文档">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Sub-Toolbar (Meta info & Zoom controls) -->
  <section class="sub-toolbar">
    <div id="file-meta-text" class="file-meta-pill">未选择文件</div>
    <div id="zoom-controls" class="zoom-controls" style="display: none;">
      <button id="btn-zoom-out" class="zoom-btn" title="缩小">-</button>
      <span id="zoom-label" class="zoom-label">100%</span>
      <button id="btn-zoom-in" class="zoom-btn" title="放大">+</button>
      <button id="btn-zoom-reset" class="zoom-btn" title="原始比例 100%">1:1</button>
      <button id="btn-zoom-fit" class="zoom-btn fit-btn" title="自适应宽度">自适应宽度</button>
    </div>
  </section>

  <!-- Main Viewport -->
  <main class="viewport-container" id="viewport-container">
    <!-- Drop Overlay -->
    <div id="drop-overlay" class="drop-overlay" style="display: none;">
      <span>释放鼠标以载入文件预览</span>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="12" y1="18" x2="12" y2="12"></line>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      <div>
        <p id="empty-title" style="font-weight: 500; margin-bottom: 4px;">未指定预览文档</p>
        <p id="empty-subtitle" style="font-size: 11.5px;">请在对话中点击文档胶囊打开，或将本地文件拖入此处</p>
      </div>
      <div id="empty-candidates" class="missing-candidates" style="display: none;"></div>
    </div>

    <!-- Loading State -->
    <div id="loading-state" class="loading-spinner" style="display: none;">
      <div class="spinner"></div>
      <span id="loading-text">正在加载文档渲染...</span>
    </div>

    <!-- DOCX Viewport -->
    <div id="docx-wrapper" style="display: none;">
      <div id="docx-render-target" class="docx-render-target"></div>
    </div>

    <!-- XLSX Viewport -->
    <div id="xlsx-wrapper" style="display: none;">
      <div id="sheet-tabs" class="sheet-tabs"></div>
      <div id="xlsx-table-wrapper" class="xlsx-table-wrapper"></div>
    </div>

    <!-- PDF Viewport -->
    <div id="pdf-wrapper" class="pdf-wrapper" style="display: none;">
      <div id="pdf-pages-container" class="pdf-pages-container"></div>
    </div>

    <!-- Plain Text Viewport -->
    <pre id="text-view" style="display: none;"></pre>
  </main>

  <!-- Floating Toast -->
  <div id="toast" class="toast" style="display: none;"></div>

  <!-- Frontend Logic -->
  <script src="/app.js?v=1.2.0"></script>
</body>
</html>
